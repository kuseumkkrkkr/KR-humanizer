<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KR-humanizer review controls</title>
  <link rel="stylesheet" href="../tokens/colors_and_type.css">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-sans)}main{max-width:920px;margin:auto;background:var(--surface-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-panel);padding:24px;box-shadow:var(--shadow-panel)}h1{font-family:var(--font-display);margin-top:0}.toolbar,.actions,.hunk-actions{display:flex;gap:8px;flex-wrap:wrap}.control{min-height:44px;padding:9px 13px;border:1px solid var(--border-subtle);border-radius:var(--radius-control);background:#fff;font:inherit;font-weight:700}.control.active,.primary{border-color:var(--action-primary);background:var(--action-primary);color:#fff}.speech-level{margin:16px 0;padding:14px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:#f8f8f5}.speech-head,.speech-ends,.hunk-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.speech-head output{color:var(--action-primary);font-weight:800}.speech-level input{width:100%;min-height:44px;accent-color:var(--action-primary)}.speech-ends{color:var(--text-muted);font-size:var(--size-caption)}.change{margin-top:16px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);overflow:hidden}.hunk-head{padding:10px 12px;background:#f8f8f5;border-bottom:1px solid var(--border-subtle)}.hunk-head code{font-weight:800}.hunk-actions .control[aria-pressed="true"]{border-color:var(--action-primary);background:var(--accent-soft);color:var(--action-primary)}.diff{font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}.line{display:grid;grid-template-columns:28px 40px 1fr;min-height:42px}.line span{padding:9px}.line .number{border-inline:1px solid rgba(24,32,28,.08);color:var(--text-muted);font-size:12px;text-align:center}.minus{background:var(--danger-soft)}.plus{background:var(--accent-soft)}.minus .sign{color:var(--danger-1);font-weight:800}.plus .sign{color:var(--accent-1);font-weight:800}.removed{background:#f3c7c1;color:#7f291f;text-decoration:line-through}.added{background:#bfe3cd;color:#0f5835;font-weight:800}.actions{justify-content:space-between;align-items:center;margin-top:16px}@media(max-width:640px){body{padding:12px}main{padding:16px}.hunk-head{align-items:stretch;flex-direction:column}.hunk-actions{display:grid;grid-template-columns:1fr 1fr}.line{grid-template-columns:24px 34px 1fr}}
  </style>
</head>
<body>
  <main>
    <h1>문장 수정 검토</h1>
    <section class="speech-level"><div class="speech-head"><strong>말투 높임 정도</strong><output>부드러운 경어 · 해요체</output></div><input type="range" min="0" max="100" step="25" value="75"><div class="speech-ends"><span>평어체</span><span>경어체</span></div></section>
    <div class="toolbar" aria-label="변경 필터">
      <button class="control active">전체 12</button><button class="control">문장 수정 9</button><button class="control">어순 변경 2</button><button class="control">통합 Diff</button><button class="control">전후 나란히</button>
    </div>
    <article class="change">
      <div class="hunk-head"><code>@@ 문장 4 · 문장 수정 @@</code><div class="hunk-actions"><button class="control" data-decision="accept" aria-pressed="true">수락</button><button class="control" data-decision="reject" aria-pressed="false">거절</button></div></div>
      <div class="diff"><div class="line minus"><span class="sign">−</span><span class="number">4</span><span>제도의 성장과 별개로 정치에 대한 신뢰는 <mark class="removed">충분하지 않다.</mark></span></div><div class="line plus"><span class="sign">+</span><span class="number">4</span><span>제도가 성장했지만 정치에 대한 신뢰는 <mark class="added">여전히 충분하지 않다.</mark></span></div></div>
    </article>
    <div class="actions"><span>수락 1 · 거절 0 · 미결정 11</span><button class="control primary">수락한 1개 변경 적용</button></div>
  </main>
  <script>document.querySelectorAll('[data-decision]').forEach((button)=>button.addEventListener('click',()=>{document.querySelectorAll('[data-decision]').forEach((item)=>item.setAttribute('aria-pressed',String(item===button)));}));</script>
</body>
</html>
