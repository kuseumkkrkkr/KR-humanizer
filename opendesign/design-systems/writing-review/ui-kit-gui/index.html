<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KR-humanizer context graph and review controls</title>
  <link rel="stylesheet" href="../tokens/colors_and_type.css">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-sans)}main{max-width:920px;margin:auto;display:grid;gap:16px}.panel{background:var(--surface-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-panel);padding:24px;box-shadow:var(--shadow-panel)}h1,h2{font-family:var(--font-display);margin-top:0}.toolbar,.actions,.hunk-actions,.segmented{display:flex;gap:8px;flex-wrap:wrap}.control{min-height:44px;padding:9px 13px;border:1px solid var(--border-subtle);border-radius:var(--radius-control);background:#fff;font:inherit;font-weight:700}.control.active,.primary{border-color:var(--action-primary);background:var(--action-primary);color:#fff}.segmented .active{background:var(--accent-soft);color:var(--action-primary)}.graph{display:flex;align-items:stretch;gap:8px;margin:16px 0;overflow:auto}.node{min-width:190px;padding:12px;border:1px solid var(--border-subtle);border-top:4px solid var(--action-primary);border-radius:var(--radius-card)}.node strong{display:block;color:var(--action-primary);font-size:12px}.node.excluded{opacity:.55;border-top-color:var(--text-muted)}.arrow{align-self:center;color:var(--text-muted)}.node-row{display:grid;grid-template-columns:70px 90px 1fr auto;gap:8px;align-items:center;margin-top:8px}.node-row input,.node-row select{min-width:0;width:100%;min-height:44px;border:1px solid var(--border-subtle);border-radius:var(--radius-control);padding:8px}.speech-level{margin:16px 0;padding:14px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:#f8f8f5}.speech-head,.speech-ends,.hunk-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.speech-head output{color:var(--action-primary);font-weight:800}.speech-level input{width:100%;min-height:44px;accent-color:var(--action-primary)}.speech-ends{color:var(--text-muted);font-size:var(--size-caption)}.change{margin-top:16px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);overflow:hidden}.hunk-head{padding:10px 12px;background:#f8f8f5;border-bottom:1px solid var(--border-subtle)}.hunk-head code{font-weight:800}.hunk-actions .control[aria-pressed="true"]{border-color:var(--action-primary);background:var(--accent-soft);color:var(--action-primary)}.diff{font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}.line{display:grid;grid-template-columns:28px 40px 1fr;min-height:42px}.line span{padding:9px}.line .number{border-inline:1px solid rgba(24,32,28,.08);color:var(--text-muted);font-size:12px;text-align:center}.minus{background:var(--danger-soft)}.plus{background:var(--accent-soft)}.minus .sign{color:var(--danger-1);font-weight:800}.plus .sign{color:var(--accent-1);font-weight:800}.removed{background:#f3c7c1;color:#7f291f;text-decoration:line-through}.added{background:#bfe3cd;color:#0f5835;font-weight:800}.actions{justify-content:space-between;align-items:center;margin-top:16px}@media(max-width:640px){body{padding:12px}.panel{padding:16px}.node-row{grid-template-columns:1fr 1fr}.node-row input{grid-column:1/-1}.hunk-head{align-items:stretch;flex-direction:column}.hunk-actions{display:grid;grid-template-columns:1fr 1fr}.line{grid-template-columns:24px 34px 1fr}}
    .editor{overflow:hidden;border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:#fcfcfa}.editor textarea{display:block;width:100%;min-height:160px;padding:16px;border:0;resize:vertical;background:transparent;font:inherit}.suggestion{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--border-subtle);background:#f3f7f4}.suggestion strong{color:var(--action-primary);font-size:12px}.editor-foot{display:flex;align-items:center;gap:8px;min-height:48px;padding:2px 12px;border-top:1px solid var(--border-subtle);font-size:12px}.switch{width:30px;height:18px;padding:2px;border-radius:99px;background:var(--action-primary)}.switch:after{content:"";display:block;width:14px;height:14px;margin-left:12px;border-radius:50%;background:#fff}.model{margin-left:auto;padding:2px 7px;border:1px solid var(--border-subtle);border-radius:99px;font:11px ui-monospace,monospace}@media(max-width:640px){.suggestion{grid-template-columns:1fr}.editor-foot{flex-wrap:wrap}.model{margin-left:auto}}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>쓰는 흐름 안에서 제안합니다</h1>
      <div class="editor"><textarea>첫 원인을 설명합니다. 다음 해결책을 제안합니다.</textarea><div class="suggestion"><strong>다음 문장</strong><span>이어서 사용자가 확인할 선택지를 분명하게 보여줍니다.</span><button class="control">Tab으로 넣기</button></div><div class="editor-foot"><span class="switch"></span><strong>다음 문장 제안</strong><span>Codex EXEC 준비됨</span><span class="model">Spark 고정</span></div></div>
    </section>
    <section class="panel">
      <h1>맥락을 먼저 고릅니다</h1>
      <div class="toolbar"><button class="control active">Plan 모드 켜짐</button><div class="segmented" aria-label="설명률"><button class="control">최저</button><button class="control active">중간</button><button class="control">최대</button></div></div>
      <div class="graph"><div class="node"><strong>도입</strong>독자가 겪는 문제</div><span class="arrow">→</span><div class="node"><strong>주장</strong>그래프로 맥락 제어</div><span class="arrow">→</span><div class="node excluded"><strong>예시 · 제외됨</strong>반복되는 부가 설명</div></div>
      <div class="node-row"><label><input type="checkbox" checked> 포함</label><select><option>주장</option></select><input value="그래프로 필요한 설명만 남기는 방법"><button class="control">↑ ↓</button></div>
      <div class="actions"><span>활성 노드 2/3</span><button class="control primary">그래프로 초안 작성</button></div>
    </section>
    <section class="panel">
      <h2>문장 수정 검토</h2>
      <section class="speech-level"><div class="speech-head"><strong>말투 높임 정도</strong><output>부드러운 경어 · 해요체</output></div><input type="range" min="0" max="100" step="25" value="75"><div class="speech-ends"><span>평어체</span><span>경어체</span></div></section>
      <div class="toolbar" aria-label="변경 필터"><button class="control active">전체 12</button><button class="control">문장 수정 9</button><button class="control">통합 Diff</button><button class="control">전후 나란히</button></div>
      <article class="change"><div class="hunk-head"><code>@@ 문장 4 · 문장 수정 @@</code><div class="hunk-actions"><button class="control" data-decision="accept" aria-pressed="true">수락</button><button class="control" data-decision="reject" aria-pressed="false">거절</button></div></div><div class="diff"><div class="line minus"><span class="sign">−</span><span class="number">4</span><span>기능을 <mark class="removed">여러 방식으로 자세하게 반복하여 설명합니다.</mark></span></div><div class="line plus"><span class="sign">+</span><span class="number">4</span><span>기능의 <mark class="added">핵심만 설명합니다.</mark></span></div></div></article>
      <div class="actions"><span>수락 1 · 거절 0 · 미결정 11</span><button class="control primary">수락한 1개 변경 적용</button></div>
    </section>
  </main>
  <script>document.querySelectorAll('[data-decision]').forEach((button)=>button.addEventListener('click',()=>{document.querySelectorAll('[data-decision]').forEach((item)=>item.setAttribute('aria-pressed',String(item===button)));}));</script>
</body>
</html>
